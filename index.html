<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c44">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Dompetku: catat pemasukan, pengeluaran, dan tabungan dengan mudah.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dompetku">
<title>Dompetku</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- sambung ke server Google lebih awal, supaya Dompetku cepat terbuka -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #1f5c44; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
  /* Layar pembuka: logo Dompetku sampai aplikasinya siap */
  #buka { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(120% 80% at 50% 0%, #2a7a58 0%, #1f5c44 60%, #18493a 100%); color: #fdf8ee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .45s ease; }
  #buka.hilang { opacity: 0; pointer-events: none; }
  #buka img { width: 92px; height: 92px; border-radius: 26px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.55); animation: denyut 1.6s ease-in-out infinite; }
  #buka b { font-size: 1.6rem; letter-spacing: -.01em; }
  #buka small { opacity: .75; font-size: .9rem; margin-top: -8px; }
  #buka .garis { width: 120px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; margin-top: 10px; }
  #buka .garis i { display: block; width: 40%; height: 100%; border-radius: 99px; background: #e8b25a; animation: jalan 1.1s ease-in-out infinite; }
  #buka .kaki { position: absolute; bottom: max(22px, env(safe-area-inset-bottom)); font-size: .75rem; opacity: .6; }
  @keyframes denyut { 50% { transform: scale(1.05); } }
  @keyframes jalan { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
</style>
</head>
<body>
<div id="buka">
  <img src="icon-192.png" alt="">
  <b>Dompetku</b>
  <small>Catatan keuangan pribadi</small>
  <div class="garis"><i></i></div>
  <div class="kaki">Dibuat oleh Pottah</div>
</div>
<iframe
  src="https://script.google.com/macros/s/AKfycbz66lWT3APFauhxR02V6ulVHhHjp6kywJNKormt5GK5JNPl8Exa8zYnoxMo93xUgsKUSg/exec"
  title="Dompetku"
  allow="clipboard-write"
  onload="cadangan(4000)"></iframe>
<script>
  // Supaya bisa dipasang seperti aplikasi ("Tambahkan ke layar utama")
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  // Layar pembuka ditutup saat Dompetku memberi tahu "siap" (layar PIN sudah tampil)
  function tutupBuka() { document.getElementById('buka').classList.add('hilang'); }
  // Pesan dari Dompetku: "siap" (tutup layar pembuka) dan "warna" (status bar ikut warna paling atas layar)
  var metaWarna = document.querySelector('meta[name="theme-color"]');
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || typeof d !== 'object') return;
    if (d.dompetku === 'siap') tutupBuka();
    else if (d.dompetku === 'warna' && /^#[0-9a-f]{6}$/i.test(d.c || '') && metaWarna) metaWarna.setAttribute('content', d.c);
  });
  // Cadangan: kalau sinyal tidak datang (mis. Dompetku versi lama), tutup juga
  var tCad = 0;
  function cadangan(ms) { clearTimeout(tCad); tCad = setTimeout(tutupBuka, ms); }
  cadangan(12000);
</script>
</body>
</html>
